apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "citybuilder.fullname" . }}-config
  labels:
    {{- include "citybuilder.labels" . | nindent 4 }}
data:
  COUCHDB_HOST: {{ .Values.couchdb.host | quote }}
  COUCHDB_PORT: {{ .Values.couchdb.port | quote }}
  COUCHDB_SCHEMA: {{ .Values.couchdb.schema | quote }}
  HTTP_PORT: {{ .Values.app.httpPort | quote }}
  HTTP_HOST: {{ .Values.app.httpHost | quote }}
