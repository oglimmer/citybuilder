apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citybuilder.fullname" . }}
  labels:
    {{- include "citybuilder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "citybuilder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "citybuilder.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "citybuilder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.httpPort }}
              protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - |
              {
              echo "dbHost=http://$DB_USER:$DB_PASSWORD@$COUCHDB_HOST:$COUCHDB_PORT"
              echo "dbSchema=$COUCHDB_SCHEMA"
              echo "db=http://$DB_USER:$DB_PASSWORD@$COUCHDB_HOST:$COUCHDB_PORT/$COUCHDB_SCHEMA"
              echo "httpPort=$HTTP_PORT"
              echo "httpHost=$HTTP_HOST"
              echo "adminUser=$ADMIN_USER"
              echo "adminPassword=$ADMIN_PASSWORD"
              } > /tmp/citybuilder.properties
              export CITYBUILDER_PROPERTIES=/tmp/citybuilder.properties
              exec node startServer.js
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-secret
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-secret
                  key: ADMIN_PASSWORD
            - name: COUCHDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-config
                  key: COUCHDB_HOST
            - name: COUCHDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-config
                  key: COUCHDB_PORT
            - name: COUCHDB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-config
                  key: COUCHDB_SCHEMA
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-config
                  key: HTTP_PORT
            - name: HTTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "citybuilder.fullname" . }}-config
                  key: HTTP_HOST
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
